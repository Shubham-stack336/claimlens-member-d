[project]
name = "claimlens-docs"
version = "0.2.0"
description = "ClaimLens document intelligence: ingestion, grounding, rules, safety and evaluation (Member 4)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pymupdf>=1.24,<2",
    "rapidfuzz>=3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claimlens_docs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
