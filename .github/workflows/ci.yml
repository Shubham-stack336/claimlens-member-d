name: CI

on:
  push:
  pull_request:

jobs:
  docs:
    name: claimlens_docs (lint, types, tests, eval gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy claimlens_docs
      - name: Unit tests
        run: pytest -q
      - name: Evaluation on synthetic cases (fails if a metric drops below target)
        run: python -m eval.run --gate
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/report.json

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the docs image
        run: |
          docker build -f deploy/Dockerfile.docs -t claimlens-docs .
          docker run --rm claimlens-docs
      - name: Check docker-compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build backend image (monorepo only)
        if: hashFiles('backend/requirements.txt') != ''
        run: docker build -f deploy/Dockerfile.backend -t claimlens-backend .
      - name: Build frontend image (monorepo only)
        if: hashFiles('frontend/package-lock.json') != ''
        run: docker build -f deploy/Dockerfile.frontend -t claimlens-frontend .

  # The two jobs below switch on by themselves once backend/ and frontend/ exist (monorepo).
  backend:
    name: backend tests on Postgres + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claimlens
          POSTGRES_PASSWORD: claimlens
          POSTGRES_DB: claimlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimlens"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://claimlens:claimlens@localhost:5432/claimlens
      MOCK_AI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          pip install -r backend/requirements.txt
          [ -d docint ] && pip install ./docint
          [ -d ai ] && pip install ./ai
          cd backend && alembic upgrade head && pytest -q
      - name: Skip (no backend/ in this repo)
        if: hashFiles('backend/requirements.txt') == ''
        run: echo "backend/ not present; skipping"

  frontend:
    name: frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check and build
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Skip (no frontend/ in this repo)
        if: hashFiles('frontend/package-lock.json') == ''
        run: echo "frontend/ not present; skipping"
